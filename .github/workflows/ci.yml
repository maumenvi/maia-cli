name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check source architecture
        run: npm run check:architecture

      - name: Check guardrails
        run: npm run guardrails:check

      - name: Check file naming
        run: npm run check:naming

      - name: Package CLI
        run: npm pack

      - name: Resolve tarball name
        run: |
          echo "TARBALL=$(node --print 'const pkg = require("./package.json"); pkg.name.replace("@", "").replace("/", "-") + "-" + pkg.version + ".tgz"')" >> "$GITHUB_ENV"

      - name: Create test directory for CLI smoke test
        run: mkdir -p /tmp/test-cli && cd /tmp/test-cli && npm init -y

      - name: Install CLI tarball in test directory
        run: |
          cd /tmp/test-cli
          npm install "${{ github.workspace }}/${TARBALL}"

      - name: "Smoke test: CLI entrypoint"
        run: |
          cd /tmp/test-cli
          ./node_modules/.bin/maia help

      - name: Validate package
        run: npm pack --dry-run
